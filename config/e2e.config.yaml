db:
  path: '/tmp/silent-pay-indexer-e2e-lmdb'
  mapSize: 67108864 # 64 MB — global env only
  commitBatchBlocks: 25 # clamped to partitionBlocks; exercises the clamp
  # Deliberately tiny so a regtest run crosses dozens of boundaries and the
  # LRU actually evicts. Production uses 1000.
  partitionBlocks: 5
  partitionMapSize: 67108864 # 64 MB
  openPartitions: 2
app:
  port: 3000
  verbose: false
  debug: true
  network: regtest
  requestRetry:
    delay: 500
    count: 1
providerType: BITCOIN_CORE_RPC
bitcoinCore:
  protocol: http
  rpcHost: localhost
  rpcPass: password
  rpcUser: polaruser
  rpcPort: 18443
throttler:
  ttl: 1000
  limit: 5
cache:
  ttl: 5000 # 5 sec
